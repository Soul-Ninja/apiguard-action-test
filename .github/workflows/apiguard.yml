name: APIGuard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write   # upload SARIF to Security > Code scanning
  pull-requests: write     # post the report as a PR comment

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.12"

      - name: Start the API under test
        run: |
          pip install -r requirements.txt
          nohup python -m uvicorn app:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/openapi.json && exit 0; sleep 1; done
          cat api.log; exit 1

      - name: Run APIGuard
        uses: Soul-Ninja/APIGuard@v1
        env:
          # Test-only passwords for this demo API. For a real API use repository secrets:
          # ALICE_PASSWORD: ${{ secrets.ALICE_PASSWORD }}
          ALICE_PASSWORD: alice-test-pw
          BOB_PASSWORD: bob-test-pw
        with:
          profile: apiguard.yaml
          fail-on: high
